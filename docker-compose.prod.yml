version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: bolo-mongo-prod
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-prod:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: bolo-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis-data-prod:/data
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bolo-server-prod
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/bolo-ai
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - JWT_SECRET=production_jwt_secret_value_here
      - JWT_REFRESH_SECRET=production_jwt_refresh_secret_value_here
      - CLIENT_URL=http://localhost
      - ENCRYPTION_KEY=12345678901234567890123456789012
      - OPENAI_API_KEY=dummy_openai_key
      - RAZORPAY_KEY_ID=dummy_key_id
      - RAZORPAY_KEY_SECRET=dummy_key_secret
      - RAZORPAY_WEBHOOK_SECRET=dummy_webhook_secret
      - META_APP_SECRET=dummy_meta_secret
      - SUPERADMIN_EMAIL=admin@bolo.ai
      - SUPERADMIN_PASSWORD=SuperadminPassword123!
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bolo-client-prod
    ports:
      - "80:80"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:5000
    restart: always

volumes:
  mongo-data-prod:
  redis-data-prod:
